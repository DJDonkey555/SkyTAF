<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>SkyTAF</title>
</head>
<body>
  <input id="icao" placeholder="FAOR" maxlength="4" />
  <button onclick="loadWeather()">Load</button>
  <div id="status"></div>

  <pre id="metar">---</pre>
  <pre id="taf">---</pre>

<script>
const API_BASE = "https://odd-sun-2389.lategan-rudolph.workers.dev";
const metarEl = document.getElementById("metar");
const tafEl = document.getElementById("taf");
const statusEl = document.getElementById("status");

async function loadWeather() {
  const icao = document.getElementById("icao").value.trim().toUpperCase();
  if (!/^[A-Z]{4}$/.test(icao)) {
    statusEl.textContent = "Invalid ICAO";
    return;
  }
  statusEl.textContent = "Loading " + icao;

  const [m, t] = await Promise.all([
    fetch(API_BASE + "/metar?icao=" + icao).then(r => r.json()),
    fetch(API_BASE + "/taf?icao=" + icao).then(r => r.json())
  ]);

  // METAR: now an array of objects [{ rawOb: "..." }, ...]
  const metarList = Array.isArray(m) ? m : [];
  const latest = metarList[0];
  const history = metarList.slice(1, 6); // up to 5 previous

  let metarText = latest && latest.rawOb ? latest.rawOb : "No METAR";
  if (history.length > 0) {
    metarText += "\n\n--- Previous METARs ---\n" +
      history.map(h => h.rawOb).join("\n\n");
  }
  metarEl.textContent = metarText;

  // TAF: unchanged
  const taf = Array.isArray(t) ? t[0] : t;
  tafEl.textContent = (taf && taf.rawTAF) ? taf.rawTAF : "No TAF";
  statusEl.textContent = "Updated " + icao;
}

setInterval(() => {
  const icao = document.getElementById("icao").value.trim();
  if (icao.length === 4) loadWeather();
}, 300000);
</script>
</body>
</html>
