<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>SkyTAF</title>
</head>
<body>
  <input id="icao" placeholder="FAOR" maxlength="4" />
  <button onclick="loadWeather()">Load</button>
  <div id="status"></div>

  <h3>METARs (last 6 hours)</h3>
  <pre id="metars">---</pre>

  <h3>Latest TAF</h3>
  <pre id="taf">---</pre>

<script>
const API_BASE = "https://odd-sun-2389.lategan-rudolph.workers.dev";
const icaoInput = document.getElementById("icao");
const metarsEl = document.getElementById("metars");
const tafEl = document.getElementById("taf");
const statusEl = document.getElementById("status");

function getIcao() {
  return icaoInput.value.trim().toUpperCase();
}

async function fetchJson(url) {
  const response = await fetch(url);
  return response.json();
}

async function loadWeather() {
  const icao = getIcao();

  if (!/^[A-Z]{4}$/.test(icao)) {
    statusEl.textContent = "Invalid ICAO";
    return;
  }

  statusEl.textContent = "Loading " + icao;

  const [tafData, metarsData] = await Promise.all([
    fetchJson(API_BASE + "/taf?icao=" + icao),
    fetchJson(API_BASE + "/recentmetar?icao=" + icao)
  ]);

  const taf = Array.isArray(tafData) ? tafData[0] : tafData;
  tafEl.textContent = taf && taf.rawTAF ? taf.rawTAF : "No TAF";

  const metars = Array.isArray(metarsData) ? metarsData : [];
  metarsEl.textContent = metars.length
    ? metars.map(item => `${item.type} ${item.rawOb}`).join("\n")
    : "No METARs available";

  statusEl.textContent = "Updated " + icao;
}

setInterval(() => {
  const icao = icaoInput.value.trim();
  if (icao.length === 4) loadWeather();
}, 300000);
</script>
</body>
</html>
