<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick METAR / TAF</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1e24;
            color: #e0e0e0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
        }
        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
        }
        input {
            flex: 1;
            padding: 14px 18px;
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: 1px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #f0f6fc;
            outline: none;
            transition: border-color 0.15s;
        }
        input:focus {
            border-color: #58a6ff;
            box-shadow: 0 0 0 2px rgba(88,166,255,0.3);
        }
        input::placeholder {
            color: #6e7681;
            letter-spacing: 0;
        }
        button {
            padding: 14px 24px;
            font-size: 1rem;
            font-weight: 600;
            background: #238636;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
            white-space: nowrap;
        }
        button:hover {
            background: #2ea043;
        }
        .panels {
            display: flex;
            gap: 20px;
        }
        .panel {
            flex: 1;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
        }
        .panel h2 {
            font-size: 1.2rem;
            margin-bottom: 12px;
            color: #58a6ff;
            border-bottom: 1px solid #21262d;
            padding-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .panel h2 .icao-tag {
            background: #21262d;
            font-size: 0.85rem;
            font-weight: normal;
            padding: 2px 8px;
            border-radius: 4px;
            color: #c9d1d9;
            margin-left: auto;
        }
        pre {
            white-space: pre-wrap;
            word-break: break-word;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 0.95rem;
            line-height: 1.6;
            color: #e6edf3;
            background: transparent;
            flex: 1;
        }
        .error {
            color: #f85149;
            font-style: italic;
        }
        .loading {
            color: #6e7681;
            font-style: italic;
        }
        @media (max-width: 600px) {
            .panels {
                flex-direction: column;
            }
            body {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="search-box">
            <input type="text" id="icaoInput" placeholder="Enter ICAO code (e.g. KJFK, EGLL)" maxlength="4" autofocus>
            <button id="fetchBtn">Get Weather</button>
        </div>
        <div class="panels">
            <div class="panel" id="metarPanel">
                <h2>METAR <span class="icao-tag" id="metarIcao"></span></h2>
                <pre id="metarText" class="loading">Enter an ICAO code above</pre>
            </div>
            <div class="panel" id="tafPanel">
                <h2>TAF <span class="icao-tag" id="tafIcao"></span></h2>
                <pre id="tafText" class="loading">Enter an ICAO code above</pre>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const input = document.getElementById('icaoInput');
            const btn = document.getElementById('fetchBtn');
            const metarText = document.getElementById('metarText');
            const tafText = document.getElementById('tafText');
            const metarIcao = document.getElementById('metarIcao');
            const tafIcao = document.getElementById('tafIcao');

            const METAR_API = 'https://aviationweather.gov/api/data/metar?ids=';
            const TAF_API = 'https://aviationweather.gov/api/data/taf?ids=';

            function setLoading() {
                metarText.textContent = 'Loading...';
                metarText.className = 'loading';
                tafText.textContent = 'Loading...';
                tafText.className = 'loading';
                metarIcao.textContent = '';
                tafIcao.textContent = '';
            }

            function displayError(element, message) {
                element.textContent = message;
                element.className = 'error';
            }

            async function fetchWeather() {
                let rawIcao = input.value.trim();
                if (!rawIcao) {
                    displayError(metarText, 'Please enter an ICAO code.');
                    displayError(tafText, '');
                    metarIcao.textContent = '';
                    tafIcao.textContent = '';
                    return;
                }

                const icao = rawIcao.toUpperCase();
                metarIcao.textContent = icao;
                tafIcao.textContent = icao;
                setLoading();

                try {
                    const [metarRes, tafRes] = await Promise.all([
                        fetch(METAR_API + icao + '&format=json'),
                        fetch(TAF_API + icao + '&format=json')
                    ]);

                    if (!metarRes.ok) throw new Error(`METAR API error (${metarRes.status})`);
                    if (!tafRes.ok) throw new Error(`TAF API error (${tafRes.status})`);

                    const metarData = await metarRes.json();
                    const tafData = await tafRes.json();

                    // Process METAR
                    if (Array.isArray(metarData) && metarData.length > 0 && metarData[0].rawOb) {
                        metarText.textContent = metarData[0].rawOb;
                        metarText.className = '';
                    } else {
                        displayError(metarText, `No METAR found for ${icao}`);
                    }

                    // Process TAF
                    if (Array.isArray(tafData) && tafData.length > 0 && tafData[0].rawTAF) {
                        tafText.textContent = tafData[0].rawTAF;
                        tafText.className = '';
                    } else {
                        displayError(tafText, `No TAF found for ${icao}`);
                    }

                } catch (err) {
                    console.error(err);
                    displayError(metarText, 'Failed to fetch data. Check connection or ICAO code.');
                    displayError(tafText, '');
                    metarIcao.textContent = '';
                    tafIcao.textContent = '';
                }
            }

            // Event listeners
            btn.addEventListener('click', fetchWeather);
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    fetchWeather();
                }
            });

            // Optional: auto-uppercase and limit length
            input.addEventListener('input', (e) => {
                e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4);
            });
        })();
    </script>
</body>
</html>
