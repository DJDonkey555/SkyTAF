<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>SkyTAF</title>
</head>
<body>

<input id="icao" placeholder="FAOR" maxlength="4" />
<button onclick="loadWeather()">Load</button>

<div id="status"></div>

<h3>METARs</h3>
<pre id="metars">---</pre>

<h3>TAF</h3>
<pre id="taf">---</pre>

<script>
const API_BASE = "https://odd-sun-2389.lategan-rudolph.workers.dev";

const icaoInput = document.getElementById("icao");
const metarsEl = document.getElementById("metars");
const tafEl = document.getElementById("taf");
const statusEl = document.getElementById("status");

function getIcao() {
  return icaoInput.value.trim().toUpperCase();
}

/* =========================
   FETCH WITH TIMEOUT
========================= */
async function fetchJson(url, timeout = 12000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeout);

  try {
    const res = await fetch(url, {
      signal: controller.signal,
      cache: "no-store"
    });

    if (!res.ok) throw new Error("HTTP " + res.status);

    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}

/* =========================
   MAIN LOAD
========================= */
async function loadWeather() {
  const icao = getIcao();

  if (!/^[A-Z]{4}$/.test(icao)) {
    statusEl.textContent = "Invalid ICAO";
    return;
  }

  statusEl.textContent = "Loading " + icao;
  metarsEl.textContent = "---";
  tafEl.textContent = "---";

  try {
    const [tafRes, metarRes] = await Promise.allSettled([
      fetchJson(`${API_BASE}/taf?icao=${icao}`),
      fetchJson(`${API_BASE}/recentmetar?icao=${icao}`)
    ]);

    // TAF
    if (tafRes.status === "fulfilled") {
      const t = tafRes.value;
      tafEl.textContent = Array.isArray(t) ? t[0]?.rawTAF || "No TAF" : "No TAF";
    } else {
      tafEl.textContent = "TAF failed";
    }

    // METAR
    if (metarRes.status === "fulfilled") {
      const m = metarRes.value;
      metarsEl.textContent = Array.isArray(m)
        ? m.map(x => `${x.type} ${x.rawOb}`).join("\n")
        : "No METARs";
    } else {
      metarsEl.textContent = "METAR failed";
    }

    statusEl.textContent = "Updated " + icao;

  } catch (err) {
    console.error(err);
    statusEl.textContent = "Error loading " + icao;
  }
}
</script>

</body>
</html>
