<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>SkyTAF</title>
</head>
<body>
  <input id="icao" placeholder="FAOR" maxlength="4" />
  <button onclick="loadWeather()">Load</button>
  <div id="status"></div>

  <h3>METARs (last 6 hours)</h3>
  <pre id="metars">---</pre>

  <h3>Latest TAF</h3>
  <pre id="taf">---</pre>

<script>
const API_BASE = "https://odd-sun-2389.lategan-rudolph.workers.dev";
const metarsEl = document.getElementById("metars");
const tafEl = document.getElementById("taf");
const statusEl = document.getElementById("status");

async function loadWeather() {
  const icao = document.getElementById("icao").value.trim().toUpperCase();
  if (!/^[A-Z]{4}$/.test(icao)) {
    statusEl.textContent = "Invalid ICAO";
    return;
  }
  statusEl.textContent = "Loading " + icao;

  const [tafData, metarsData] = await Promise.all([
    fetch(API_BASE + "/taf?icao=" + icao).then(r => r.json()),
    fetch(API_BASE + "/recentmetar?icao=" + icao).then(r => r.json())
  ]);

  // TAF
  const taf = Array.isArray(tafData) ? tafData[0] : tafData;
  tafEl.textContent = (taf && taf.rawTAF) ? taf.rawTAF : "No TAF";

  // Combined METAR list (all reports from last 6 hours with type)
  const metars = Array.isArray(metarsData) ? metarsData : [];
  if (metars.length > 0) {
    metarsEl.textContent = metars
      .map(item => `${item.type} ${item.rawOb}`)
      .join("\n");
  } else {
    metarsEl.textContent = "No METARs available";
  }

  statusEl.textContent = "Updated " + icao;
}

// Auto-refresh every 5 minutes
setInterval(() => {
  const icao = document.getElementById("icao").value.trim();
  if (icao.length === 4) loadWeather();
}, 300000);
</script>
</body>
</html>
