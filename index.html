<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkyTAF</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: #e8f1ff;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    h1 {
      margin-bottom: 10px;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    input {
      flex: 1;
      min-width: 200px;
      padding: 12px;
      font-size: 16px;
      text-transform: uppercase;
      border: 1px solid #2a3b5f;
      background: #0f1726;
      color: white;
      border-radius: 8px;
      outline: none;
    }

    button {
      padding: 12px 16px;
      background: #4ea1ff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .status {
      margin-bottom: 15px;
      color: #9fb0ca;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .panel {
      background: #111a2b;
      border: 1px solid #22314d;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      min-height: 300px;
    }

    .panel h2 {
      margin: 0;
      padding: 10px;
      background: #0d1627;
      border-bottom: 1px solid #22314d;
      font-size: 14px;
    }

    pre {
      margin: 0;
      padding: 12px;
      white-space: pre-wrap;
      word-break: break-word;
      flex: 1;
      overflow: auto;
      font-size: 13px;
    }

    @media (max-width: 800px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>SkyTAF</h1>

    <div class="controls">
      <input id="icao" placeholder="FAOR" maxlength="4" />
      <button onclick="loadWeather()">Load</button>
    </div>

    <div id="status" class="status">Ready</div>

    <div class="grid">
      <div class="panel">
        <h2>METAR</h2>
        <pre id="metar">Enter ICAO code</pre>
      </div>

      <div class="panel">
        <h2>TAF</h2>
        <pre id="taf">Enter ICAO code</pre>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "https://odd-sun-2389.lategan-rudolph.workers.dev";

    const icaoInput = document.getElementById("icao");
    const metarEl = document.getElementById("metar");
    const tafEl = document.getElementById("taf");
    const statusEl = document.getElementById("status");

    function setStatus(msg) {
      statusEl.textContent = msg;
    }

    async function fetchData(type, icao) {
      const res = await fetch(`${API_BASE}/${type}?icao=${icao}`);
      if (!res.ok) throw new Error(type + " failed");
      return await res.json();
    }

    function format(data) {
      if (!Array.isArray(data)) return "No data";
      return data.map(d => d.raw_text || JSON.stringify(d)).join("\n\n---\n\n");
    }

    async function loadWeather() {
      const icao = icaoInput.value.trim().toUpperCase();

      if (!/^[A-Z]{4}$/.test(icao)) {
        setStatus("Invalid ICAO");
        return;
      }

      setStatus("Loading " + icao + "...");

      metarEl.textContent = "Loading...";
      tafEl.textContent = "Loading...";

      try {
        const [metar, taf] = await Promise.all([
          fetchData("metar", icao),
          fetchData("taf", icao)
        ]);

        metarEl.textContent = format(metar);
        tafEl.textContent = format(taf);

        setStatus("Loaded " + icao);
      } catch (e) {
        setStatus("Error loading data");
        metarEl.textContent = "Error";
        tafEl.textContent = "Error";
      }
    }

    icaoInput.addEventListener("keydown", e => {
      if (e.key === "Enter") loadWeather();
    });
  </script>
</body>
</html>
