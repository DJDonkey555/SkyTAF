<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>SkyTAF</title>
<style>
  body { font-family: monospace; background: #fff; color: #000; }
  pre { 
    padding: 10px; 
    border: 1px solid #ccc; 
    background: #f9f9f9; 
    white-space: pre-wrap; 
    font-family: monospace;
    line-height: 1.6;
  }
  /* Colour classes for METAR/TAF tokens */
  .icao     { color: #1E90FF; font-weight: bold; }   /* DodgerBlue */
  .type     { color: #A52A2A; font-weight: bold; }   /* Brown for METAR/SPECI label */
  .time     { color: #FF8C00; }                      /* DarkOrange */
  .wind     { color: #2E8B57; }                      /* SeaGreen */
  .vis      { color: #008B8B; }                      /* DarkCyan */
  .weather  { color: #B22222; font-weight: bold; }   /* FireBrick */
  .clouds   { color: #708090; }                      /* SlateGray */
  .temp     { color: #8B008B; }                      /* DarkMagenta */
  .qnh      { color: #4169E1; }                      /* RoyalBlue */
  .rmk      { color: #8B4513; }                      /* SaddleBrown */
  .other    { color: #228B22; }                      /* ForestGreen (fallback) */
</style>
</head>
<body>
  <input id="icao" placeholder="FAOR" maxlength="4" />
  <button onclick="loadWeather()">Load</button>
  <label style="margin-left: 10px;">
    <input type="checkbox" id="colorToggle" onchange="renderDisplay()" /> Color code
  </label>
  <div id="status"></div>

  <h3>METARs (last 6 hours)</h3>
  <pre id="metars">---</pre>

  <h3>Latest TAF</h3>
  <pre id="taf">---</pre>

<script>
const API_BASE = "https://odd-sun-2389.lategan-rudolph.workers.dev";
const metarsEl = document.getElementById("metars");
const tafEl = document.getElementById("taf");
const statusEl = document.getElementById("status");
const colorToggle = document.getElementById("colorToggle");

let lastMetars = [];   // {rawOb, type}[]
let lastTaf = "";

// ── Tokenization & colouring for METAR ────────────
function colorizeMetar(rawOb, type) {
  // Assemble the full string: "SPECI FACT 090730Z ..." or "METAR FACT ..."
  const full = `${type} ${rawOb}`;
  const tokens = [];
  let remaining = rawOb; // without the pre-pended type

  // Helper to push a token span with given class
  const pushToken = (text, cls) => {
    if (text) tokens.push(`<span class="${cls}">${text}</span>`);
  };

  // Add the type label (METAR or SPECI)
  tokens.push(`<span class="type">${type}</span>`);

  // Tokenize rawOb using regex. Match components in order.
  // ICAO: 4 letters
  const icaoMatch = remaining.match(/^([A-Z]{4})\s/);
  if (icaoMatch) {
    pushToken(icaoMatch[1], "icao");
    remaining = remaining.slice(icaoMatch[0].length);
  }

  // Date/time: \d{6}Z
  const timeMatch = remaining.match(/^(\d{6}Z)\s/);
  if (timeMatch) {
    pushToken(timeMatch[1], "time");
    remaining = remaining.slice(timeMatch[0].length);
  }

  // Wind: either VRB\d{2}KT or \d{5}KT optionally followed by G\d{2}KT and wind direction variation
  const windMatch = remaining.match(/^((?:VRB|\d{3})\d{2}(?:G\d{2})?KT)(?:\s+(\d{3}V\d{3}))?\s/);
  if (windMatch) {
    pushToken(windMatch[1], "wind");
    if (windMatch[2]) pushToken(windMatch[2], "wind");
    remaining = remaining.slice(windMatch[0].length);
  }

  // Visibility: either CAVOK, or \d{4} (meters) or number+SM, or M? (miles) like 10SM
  let visMatch = remaining.match(/^(CAVOK|\d{4}|(?:\d+\s?\d*\/?\d*)SM)\s/);
  if (!visMatch) {
    // Try just "9999" (already covered), also "9999" includes 4 digits.
    visMatch = remaining.match(/^(\d{4})\s/);
  }
  if (visMatch) {
    pushToken(visMatch[1], "vis");
    remaining = remaining.slice(visMatch[0].length);
  }

  // Weather phenomena: can be multiple groups like +TSRA, BR, etc.
  // Regex: [+-]? (2-letter abbreviations, up to 7 characters total) e.g., +TSRA, BR, HZ, VCSH
  while (remaining.length > 0) {
    const wxMatch = remaining.match(/^([+-]?(?:VC)?(?:MI|PR|BC|DR|BL|SH|TS|FZ|DZ|RA|SN|SG|IC|PL|GR|GS|UP|BR|FG|FU|VA|DU|SA|HZ|PY|PO|SQ|FC|SS|DS|NSW|NSC|NCD|CAVOK)+)\s/);
    if (wxMatch) {
      pushToken(wxMatch[1], "weather");
      remaining = remaining.slice(wxMatch[0].length);
    } else {
      break;
    }
  }

  // Clouds: can be SKC, FEW, SCT, BKN, OVC followed by 3 digits and optional CB/TCU
  while (remaining.length > 0) {
    const cloudMatch = remaining.match(/^((?:FEW|SCT|BKN|OVC|SKC|VV|NSC|NCD)(?:\d{3}(?:CB|TCU)?)?)\s/);
    if (cloudMatch) {
      pushToken(cloudMatch[1], "clouds");
      remaining = remaining.slice(cloudMatch[0].length);
    } else {
      break;
    }
  }

  // Temperature/Dewpoint: XX/XX or MXX/MXX
  const tempMatch = remaining.match(/^((?:M?\d{2})\/(?:M?\d{2}))\s/);
  if (tempMatch) {
    pushToken(tempMatch[1], "temp");
    remaining = remaining.slice(tempMatch[0].length);
  }

  // QNH: Q[0-9]{4}
  const qnhMatch = remaining.match(/^(Q\d{4})\s/);
  if (qnhMatch) {
    pushToken(qnhMatch[1], "qnh");
    remaining = remaining.slice(qnhMatch[0].length);
  }

  // Remarks and other words (NOSIG, TEMPO, RMK, etc.)
  // Anything else until end: split by spaces and colour as "rmk" or "other"
  if (remaining.trim().length > 0) {
    const restTokens = remaining.trim().split(/\s+/);
    restTokens.forEach(word => {
      // Classify some known remarks
      if (/^(NOSIG|TEMPO|BECMG|FM|TL|PROB\d{2}|RMK|AT|WS|TKOF|LDG|RWY|AUTO|COR|CCL|CMG|MM)$/i.test(word)) {
        pushToken(word, "rmk");
      } else if (/^\d+$/.test(word) && word.length >= 4) {
        pushToken(word, "vis"); // fallback visibility numbers
      } else {
        pushToken(word, "other");
      }
    });
  }

  return tokens.join(" ");
}

// ── Tokenization & colouring for TAF ──────────────
function colorizeTaf(rawTAF) {
  // TAF is similar to METAR but has different sections.
  // We'll colorize: "TAF" (if present), ICAO, time, validity period, wind, vis, weather, clouds, temp, etc.
  // We can reuse a similar tokenizer but with extra handling for "TAF" keyword.
  let remaining = rawTAF.trim();
  const tokens = [];

  const pushToken = (text, cls) => {
    if (text) tokens.push(`<span class="${cls}">${text}</span>`);
  };

  // Optional "TAF" keyword
  if (/^TAF\s/.test(remaining)) {
    pushToken("TAF", "type");
    remaining = remaining.replace(/^TAF\s/, "");
  }

  // ICAO
  const icaoMatch = remaining.match(/^([A-Z]{4})\s/);
  if (icaoMatch) {
    pushToken(icaoMatch[1], "icao");
    remaining = remaining.slice(icaoMatch[0].length);
  }

  // Validity: \d{6}Z or date/time group like 0904/1012
  const validityMatch = remaining.match(/^(\d{4}\/\d{4})\s/);
  if (validityMatch) {
    pushToken(validityMatch[1], "time");
    remaining = remaining.slice(validityMatch[0].length);
  }

  // Wind
  const windMatch = remaining.match(/^((?:VRB|\d{3})\d{2}(?:G\d{2})?KT)\s/);
  if (windMatch) {
    pushToken(windMatch[1], "wind");
    remaining = remaining.slice(windMatch[0].length);
  }

  // Visibility
  let visMatch = remaining.match(/^(CAVOK|\d{4})\s/);
  if (visMatch) {
    pushToken(visMatch[1], "vis");
    remaining = remaining.slice(visMatch[0].length);
  }

  // Weather (multiple)
  while (true) {
    const wxMatch = remaining.match(/^([+-]?(?:VC)?(?:MI|PR|BC|DR|BL|SH|TS|FZ|DZ|RA|SN|SG|IC|PL|GR|GS|UP|BR|FG|FU|VA|DU|SA|HZ|PY|PO|SQ|FC|SS|DS|NSW|NSC|NCD|CAVOK)+)\s/);
    if (wxMatch) {
      pushToken(wxMatch[1], "weather");
      remaining = remaining.slice(wxMatch[0].length);
    } else break;
  }

  // Clouds
  while (true) {
    const cloudMatch = remaining.match(/^((?:FEW|SCT|BKN|OVC|SKC|VV|NSC|NCD)(?:\d{3}(?:CB|TCU)?)?)\s/);
    if (cloudMatch) {
      pushToken(cloudMatch[1], "clouds");
      remaining = remaining.slice(cloudMatch[0].length);
    } else break;
  }

  // Temperature groups (TX, TN) or just temp/dewpoint
  // Pattern: TXxx/yyZ or TNxx/yyZ or XX/XX
  while (true) {
    const tempGroup = remaining.match(/^((?:TX|TN)?(?:\d{2})\/\d{2}Z?)\s/);
    if (tempGroup) {
      pushToken(tempGroup[1], "temp");
      remaining = remaining.slice(tempGroup[0].length);
    } else break;
  }

  // QNH
  const qnhMatch = remaining.match(/^(Q\d{4})\s/);
  if (qnhMatch) {
    pushToken(qnhMatch[1], "qnh");
    remaining = remaining.slice(qnhMatch[0].length);
  }

  // Remarks / other tokens
  if (remaining.trim().length > 0) {
    const restTokens = remaining.trim().split(/\s+/);
    restTokens.forEach(word => {
      if (/^(NOSIG|TEMPO|BECMG|FM|TL|PROB\d{2}|RMK|AT|WS|TKOF|LDG|RWY|AUTO|COR|CCL|CMG|MM)$/i.test(word)) {
        pushToken(word, "rmk");
      } else if (/^\d+$/.test(word) && word.length >= 4) {
        pushToken(word, "vis");
      } else {
        pushToken(word, "other");
      }
    });
  }

  return tokens.join(" ");
}

// ── Render all data according to toggle state ─────
function renderDisplay() {
  const colored = colorToggle.checked;

  // Render METARs
  if (lastMetars.length === 0) {
    metarsEl.textContent = "No METARs available";
  } else {
    if (colored) {
      metarsEl.innerHTML = lastMetars.map(item => colorizeMetar(item.rawOb, item.type)).join("\n");
    } else {
      metarsEl.textContent = lastMetars.map(item => `${item.type} ${item.rawOb}`).join("\n");
    }
  }

  // Render TAF
  if (!lastTaf || lastTaf === "No TAF") {
    tafEl.textContent = lastTaf || "No TAF";
  } else {
    if (colored) {
      tafEl.innerHTML = colorizeTaf(lastTaf);
    } else {
      tafEl.textContent = lastTaf;
    }
  }
}

// ── Main fetch function ───────────────────────────
async function loadWeather() {
  const icao = document.getElementById("icao").value.trim().toUpperCase();
  if (!/^[A-Z]{4}$/.test(icao)) {
    statusEl.textContent = "Invalid ICAO";
    return;
  }
  statusEl.textContent = "Loading " + icao;

  try {
    const [tafRes, metarsRes] = await Promise.all([
      fetch(API_BASE + "/taf?icao=" + icao).then(r => r.json()),
      fetch(API_BASE + "/recentmetar?icao=" + icao).then(r => r.json())
    ]);

    lastMetars = Array.isArray(metarsRes) ? metarsRes : [];
    const taf = Array.isArray(tafRes) ? tafRes[0] : tafRes;
    lastTaf = (taf && taf.rawTAF) ? taf.rawTAF : "No TAF";

    statusEl.textContent = "Updated " + icao;
  } catch (e) {
    statusEl.textContent = "Fetch error";
    lastMetars = [];
    lastTaf = "No TAF";
  }

  renderDisplay();
}

// Auto-refresh every 5 minutes
setInterval(() => {
  const icao = document.getElementById("icao").value.trim();
  if (icao.length === 4) loadWeather();
}, 300000);
</script>
</body>
</html>
